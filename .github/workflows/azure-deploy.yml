name: Azure Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: thrivewell

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: thrivewell
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          test -n "$AZURE_WEBAPP_NAME" || { echo "Missing secret: AZURE_WEBAPP_NAME"; exit 1; }
          test -n "$AZURE_WEBAPP_PUBLISH_PROFILE" || { echo "Missing secret: AZURE_WEBAPP_PUBLISH_PROFILE"; exit 1; }

      - name: Log in to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Build and push container image
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/thrivewell
        run: |
          docker build -t $GHCR_IMAGE:${{ github.sha }} .
          docker tag $GHCR_IMAGE:${{ github.sha }} $GHCR_IMAGE:latest
          docker push $GHCR_IMAGE:${{ github.sha }}
          docker push $GHCR_IMAGE:latest

      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/${{ github.repository_owner }}/thrivewell:latest

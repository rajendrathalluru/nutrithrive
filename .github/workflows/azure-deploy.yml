name: Azure Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: thrivewell

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and push container image
        run: |
          docker build -t ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${{ github.sha }} .
          docker tag ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${{ github.sha }} ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_NAME}:latest
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${{ github.sha }}
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_NAME}:latest

      - name: Point App Service to latest image
        run: |
          az webapp config container set \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --container-image-name ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_NAME}:latest \
            --container-registry-url https://${{ secrets.AZURE_ACR_LOGIN_SERVER }} \
            --container-registry-user ${{ secrets.AZURE_ACR_USERNAME }} \
            --container-registry-password ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Apply App Service settings
        run: |
          az webapp config appsettings set \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --settings \
              OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
              DATA_FILE_PATH='app/data/Recipe.csv' \
              API_HOST='0.0.0.0' \
              PORT='8000' \
              WEBSITES_PORT='8000' \
              CORS_ORIGINS='${{ secrets.AZURE_CORS_ORIGINS }}'

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME }}
